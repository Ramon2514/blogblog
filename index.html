<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Site</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Bem-vindo ao Meu Site!</h1>
    </header>

    <main>
        <div class="card">
            <h2>Sobre Mim</h2>
            <p>Este é um site simples com arquivos HTML e CSS separados para manter o código organizado.</p>
            <button onclick="alert('Olá! Obrigado por clicar.')">Clique Aqui</button>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 - Criado com HTML e CSS</p>
        <p id="texto-post">Bem vindo a o meu blog</p>
        </footer>
        <form
    action="https://formspree.io/f/xdaqjgzn"
    method="POST"
    id="meu-form"
    >
    <label>
        Your email:
        <input type="email" name="email">
    </label>
    <label>
        Your message:
        <textarea name="message"></textarea>
    </label>
    <!-- your other form fields go here -->
    <button type="submit">Send</button>
    </form>
      <script>
      const form = document.getElementById('meu-form');
      const textoPost = document.getElementById('texto-post');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        textoPost.innerText = "🤖 A IA está pensando...";

        // Faz a requisição direto para o Webhook de PRODUÇÃO do n8n
        const response = await fetch('https://ramon25.app.n8n.cloud/webhook-test/b08b5a43-54c1-4e70-889e-6f4b345ab878', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            message: document.getElementById('message').value
          })
        });

        // Pede para o navegador ler a resposta como texto puro
        const text = await response.text();

        // Substitui o texto pela resposta da IA!
        textoPost.innerHTML = marked.parse(text);
      });
    </script>
</body>
</html>
